spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://realms/test
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL:DEBUG}

service:
  bazar-persona:
    url: http://localhost:${service.bazar-persona.port}
    port: 8081

settings:
  scheduler:
    message:
      deleteMessages: "0 0 3 * * *"
  message:
    replyPreviewLength: 30